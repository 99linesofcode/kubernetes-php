apiVersion: v2
name: laravel-stack
version: 0.1.4
dependencies:
  # PostgreSQL (conditional — enabled via postgresql.enabled)
  - name: postgresql
    version: 16.7.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  # Redis cache/queue (conditional — enabled via redis.enabled)
  - name: redis
    version: 27.0.18
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  # FrankenPHP application — the local app subchart
  - name: frankenphp
    version: 0.1.0
    repository: "file://charts/frankenphp"
